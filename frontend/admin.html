<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConcertHub</title><link rel="stylesheet" href="css/style.css"></head><body data-page="admin"><header><div class="container nav"><a href="index.html" class="logo">♫ Concert<span>Hub</span></a><nav><a href="index.html">Home</a><a href="concerts.html">Concerts</a><div id="auth-links" style="display:flex;align-items:center;gap:14px"></div></nav></div></header><main class="container"><div class="panel"><span class="eyebrow">Manage events</span><h1>Add <span>concert</span></h1><form id="admin-form"><div class="field"><label>Title</label><input class="input" name="title" required></div><div class="field"><label>Artist</label><input class="input" name="artist" required></div><div class="field"><label>Venue</label><input class="input" name="venue" required></div><div class="field"><label>City</label><input class="input" name="city" required></div><div class="field"><label>Date</label><input class="input" type="date" name="event_date" required></div><div class="field"><label>Time</label><input class="input" type="time" name="event_time" required></div><div class="field"><label>Ticket price ₹</label><input class="input" type="number" min="1" step="0.01" name="price" required></div><div class="field"><label>Available tickets</label><input class="input" type="number" min="1" name="available_tickets" required></div><div class="field"><label>Description</label><input class="input" name="description"></div><button class="btn">Add concert</button></form></div><div id="message" class="alert hidden"></div></main><footer class="footer"><div class="container">© ConcertHub · Feel the sound. Live the moment. · Academic demonstration</div></footer><script src="js/app.js"></script></body></html>
